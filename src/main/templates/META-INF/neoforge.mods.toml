modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Client-only: dedicated servers do not need this mod installed.
displayTest="IGNORE_ALL_VERSION"
description='''
Client-side Chinese and English names for item tooltips.
When Jade is installed, looked-at block and entity names get the same second line.
When JEI is installed, item search also matches the other language, pinyin, and initials.
A hotkey switches the whole client between Chinese and English without reloading resource packs.
When AE2 is installed, the ME terminal item search uses the same Chinese, English, and pinyin terms.
When Integrated Terminals is installed, the storage terminal name search uses those terms too.
When JourneyMap is installed, waypoint manager search also matches Chinese names by pinyin and initials.
If Polyglot Tooltip or Language Reload is installed, this mod stands down.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="[1.21.1-6.0.0,)"
    ordering="NONE"
    side="CLIENT"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
    config="${mod_id}.mixins.json"

[[mixins]]
    config="${mod_id}-language.mixins.json"

[[mixins]]
    config="${mod_id}-ae2.mixins.json"

[[mixins]]
    config="${mod_id}-integratedterminals.mixins.json"

[[mixins]]
    config="${mod_id}-gametest.mixins.json"

[[mixins]]
    config="${mod_id}-freeze.mixins.json"

[[mixins]]
    config="${mod_id}-journeymap.mixins.json"
