# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://github.com/neoforged/ModDevGradle
# Latest Parchment versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Pinned to the requested NeoForge build. The Minecraft version must match.
neo_version=21.1.251
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod properties

# Must match MCBilingual.MOD_ID and the regex [a-z][a-z0-9_]{1,63}
mod_id=mcbilingual
mod_name=MCBilingual
mod_license=All Rights Reserved
mod_version=0.1.0
# Matches the base package used for the mod sources.
mod_group_id=pnnh.mcbilingual

# Optional dev/compile dependency. Not published with the mod.
# Same 1.21.1 NeoForge line PolyglotTooltip main already builds against.
jade_version=15.10.5+neoforge

# Optional dev/compile dependency. Not published with the mod.
# 1.21.1 NeoForge line resolved from maven.blamejared.com on 2026-10-22.
jei_version=19.64.0.455

# Embedded search helper. Apache-2.0. Not a translation pack.
tinypinyin_version=2.0.3

# Dev-only optional integration. Not published. NeoForge range [21.1.169,).
ae2_version=19.2.18
# The 19.2.18 build compiles against this GuideME. Dev runtime only.
guideme_version=21.1.1

# CurseForge file ids. Minecraft 1.21.1, NeoForge, accepted by NeoForge 21.1.251.
# MineColonies 1.1.1405 requires NeoForge [21.1.0,).
minecolonies_file=9276847
structurize_file=9017852
blockui_file=9137005
domum_ornamentum_file=8784713
multipiston_file=7097877
towntalk_file=5653504
