plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // TinyPinyin 2.0.3 is not published to Maven Central.
    maven {
        name = "AliyunPublic"
        url = "https://maven.aliyun.com/repository/public"
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime is present at dev-run time and is not published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Jade is optional at runtime. compileOnly keeps the plugin compiling;
    // localRuntime loads it for dev clients and is not published.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Dev jar only. The packaged mod does not declare a JEI dependency.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Per-character pinyin. The trie dependency is only used by the string API.
    jarJar(implementation("com.github.promeg:tinypinyin:${tinypinyin_version}") {
        exclude group: "org.ahocorasick", module: "ahocorasick"
    }) {
        version {
            strictly "[${tinypinyin_version},2.1)"
            prefer tinypinyin_version
        }
    }
    // Dev runs on 1.21.1 do not load Jar-in-Jar contents from the classes directory.
    additionalRuntimeClasspath("com.github.promeg:tinypinyin:${tinypinyin_version}") {
        exclude group: "org.ahocorasick", module: "ahocorasick"
    }

    // AE2 is optional. compileOnly is only for the client mixin. Neither jar is published.
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"

    // Separate mods at dev time. Not compile dependencies and not shipped.
    // I18nUpdateMod 3.7.0 only has fabric.mod.json, so NeoForge 21.1.251 skips it.
    // I18nAutoUpdateMod 1.2.0 calls FMLLoader.getCurrent(), which loader 4.0.44 does not have.
    // Its jar is not a dependency. The task below merges the same Forge packs it would.
    localRuntime "curse.maven:minecolonies-245506:${minecolonies_file}"
    localRuntime "curse.maven:structurize-298744:${structurize_file}"
    localRuntime "curse.maven:blockui-522992:${blockui_file}"
    localRuntime "curse.maven:domum-ornamentum-527361:${domum_ornamentum_file}"
    localRuntime "curse.maven:multi-piston-303278:${multipiston_file}"
    localRuntime "curse.maven:towntalk-900364:${towntalk_file}"

    // JourneyMap is optional. compileOnly is only for the waypoint filter mixin.
    compileOnly "maven.modrinth:journeymap:${journeymap_version}"
    localRuntime "maven.modrinth:journeymap:${journeymap_version}"

    // Integrated Terminals is optional. compileOnly is only for the client mixin.
    // The other four are dev runtime only and are not published.
    compileOnly "maven.modrinth:integrated-terminals:${integratedterminals_version}"
    localRuntime "maven.modrinth:integrated-terminals:${integratedterminals_version}"
    localRuntime "maven.modrinth:cyclops-core:${cyclopscore_version}"
    localRuntime "maven.modrinth:integrated-dynamics:${integrateddynamics_version}"
    localRuntime "maven.modrinth:common-capabilities:${commoncapabilities_version}"
    localRuntime "maven.modrinth:integrated-tunnels:${integratedtunnels_version}"
}

tasks.named("test") {
    useJUnitPlatform()
}

def languagePack = layout.projectDirectory.file(
        "run/resourcepacks/Minecraft-Mod-Language-Modpack-1-21.zip").asFile
def clientOptions = layout.projectDirectory.file("run/options.txt").asFile

// CC BY-NC-SA resource packs. Dev client only. The run/ directory is not committed.
// I18nAutoUpdateMod selects Forge packs 1.21, then 1.20, then 1.19 for Minecraft 1.21.1.
// The 1.21 pack has no Domum Ornamentum text. The 1.20 pack does. The first copy of a path wins.
tasks.register("downloadLanguagePack") {
    outputs.file(languagePack)
    outputs.upToDateWhen { false }
    inputs.file(clientOptions).optional(true)
    doLast {
        def sources = [
                [zip: "Minecraft-Mod-Language-Modpack-1-21.zip", md5: "1.21.md5"],
                [zip: "Minecraft-Mod-Language-Modpack-1-20.zip", md5: "1.20.md5"],
                [zip: "Minecraft-Mod-Language-Modpack-1-19.zip", md5: "1.19.md5"],
        ]
        def root = "https://github.com/CFPAOrg/Minecraft-Mod-Language-Package/releases/download/autobuild/"
        languagePack.parentFile.mkdirs()
        def cache = new File(languagePack.parentFile, ".cache")
        cache.mkdirs()
        def stale = !languagePack.exists() || languagePack.length() == 0
        def cachedZips = []
        sources.each { source ->
            def md5File = new File(cache, source.md5)
            def zipFile = new File(cache, source.zip)
            def remoteMd5 = java.net.URI.create(root + source.md5).toURL().text.trim()
            def localMd5 = md5File.exists() ? md5File.getText("UTF-8").trim() : ""
            if (localMd5 != remoteMd5 || !zipFile.exists() || zipFile.length() == 0) {
                def part = new File(cache, source.zip + ".part")
                java.net.URI.create(root + source.zip).toURL().withInputStream { input ->
                    part.withOutputStream { output -> output << input }
                }
                if (zipFile.exists()) {
                    zipFile.delete()
                }
                if (!part.renameTo(zipFile)) {
                    throw new GradleException("Could not store ${source.zip}")
                }
                md5File.write(remoteMd5 + "\n", "UTF-8")
                stale = true
            }
            cachedZips << zipFile
        }
        if (stale) {
            def temp = new File(languagePack.parentFile, languagePack.name + ".tmp")
            def seen = new HashSet<String>()
            def output = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(temp))
            try {
                cachedZips.each { zipFile ->
                    def source = new java.util.zip.ZipFile(zipFile)
                    try {
                        source.entries().each { entry ->
                            if (entry.directory || !seen.add(entry.name)) {
                                return
                            }
                            output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (entry.name == "pack.mcmeta") {
                                // The published 1.21 pack says format 33 and support [34, 37].
                                // Minecraft 1.21.1 then treats it as 33 and drops it.
                                def text = source.getInputStream(entry).getText("UTF-8")
                                        .replace('"pack_format": 33', '"pack_format": 34')
                                output.write(text.getBytes("UTF-8"))
                            } else {
                                output.write(source.getInputStream(entry).bytes)
                            }
                            output.closeEntry()
                        }
                    } finally {
                        source.close()
                    }
                }
            } catch (Exception exception) {
                output.close()
                temp.delete()
                throw exception
            }
            output.close()
            if (languagePack.exists() && !languagePack.delete()) {
                temp.delete()
                throw new GradleException("Could not replace ${languagePack}")
            }
            if (!temp.renameTo(languagePack)) {
                throw new GradleException("Could not replace ${languagePack}")
            }
        }
        if (!clientOptions.exists()) {
            return
        }
        def pack = "file/Minecraft-Mod-Language-Modpack-1-21.zip"
        def text = clientOptions.getText("UTF-8")
        if (text.contains(pack)) {
            return
        }
        def updated = text.replace("resourcePacks:[]", "resourcePacks:[\"${pack}\"]")
        if (updated == text) {
            updated = text.replace("resourcePacks:[", "resourcePacks:[\"${pack}\",")
        }
        clientOptions.write(updated, "UTF-8")
    }
}

tasks.named("runClient") {
    dependsOn("downloadLanguagePack")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
