plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    // TinyPinyin 2.0.3 is not published to Maven Central.
    maven {
        name = "AliyunPublic"
        url = "https://maven.aliyun.com/repository/public"
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime is present at dev-run time and is not published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Jade is optional at runtime. compileOnly keeps the plugin compiling;
    // localRuntime loads it for dev clients and is not published.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // JEI is optional at runtime. The full mod jar is the 19.64 API surface.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Per-character pinyin. The trie dependency is only used by the string API.
    jarJar(implementation("com.github.promeg:tinypinyin:${tinypinyin_version}") {
        exclude group: "org.ahocorasick", module: "ahocorasick"
    }) {
        version {
            strictly "[${tinypinyin_version},2.1)"
            prefer tinypinyin_version
        }
    }
    // Dev runs on 1.21.1 do not load Jar-in-Jar contents from the classes directory.
    additionalRuntimeClasspath("com.github.promeg:tinypinyin:${tinypinyin_version}") {
        exclude group: "org.ahocorasick", module: "ahocorasick"
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
